name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      # Pinned so a new ruff release cannot turn a green branch red on its own.
      - name: Install ruff
        run: python -m pip install ruff==0.15.18
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Unit tests
        run: python -m unittest discover -s tests
      - name: Self verify
        run: python -m sicario_cli.cli verify .
      - name: Build and install smoke test
        run: |
          tmpdir="$(mktemp -d)"
          python -m pip wheel . -w "$tmpdir/wheelhouse"
          python -m venv "$tmpdir/venv"
          # The wheel must contain the preset modules and packaged rules. An
          # earlier setup.py drifted from pyproject and silently excluded the
          # presets package, so installed builds could not generate governance
          # docs; content is asserted so that class of drift fails CI.
          python - "$tmpdir"/wheelhouse/sicario_spec-*.whl <<'EOF'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          mods = [n for n in names if n.startswith("presets/") and n.endswith(".py")]
          rules = [n for n in names if "assets" in n and n.endswith(".rule.json")]
          assert len(mods) >= 3, f"presets modules missing from wheel: {mods}"
          assert len(rules) >= 21, f"packaged rules missing from wheel: {len(rules)}"
          print(f"wheel content ok: {len(mods)} preset modules, {len(rules)} rules")
          EOF
          "$tmpdir/venv/bin/pip" install "$tmpdir"/wheelhouse/sicario_spec-*.whl
          "$tmpdir/venv/bin/sicario" --version
          "$tmpdir/venv/bin/sicario" init "$tmpdir/project" --profile appsec,cloud-iac,security-toolchain,compliance
          "$tmpdir/venv/bin/sicario" verify "$tmpdir/project"
