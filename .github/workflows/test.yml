name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      # Hash-pinned so neither a new ruff release nor a tampered artifact can
      # change what lints this repo (Scorecard PinnedDependencies).
      - name: Install ruff
        run: python -m pip install --require-hashes -r .github/requirements/lint.txt
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Unit tests
        run: python -m unittest discover -s tests
      - name: Self verify
        run: python -m sicario_cli.cli verify .
      - name: Build and install smoke test
        run: |
          tmpdir="$(mktemp -d)"
          python -m pip wheel . -w "$tmpdir/wheelhouse"
          python -m venv "$tmpdir/venv"
          # The wheel must contain the preset modules and packaged rules. An
          # earlier setup.py drifted from pyproject and silently excluded the
          # presets package, so installed builds could not generate governance
          # docs; content is asserted so that class of drift fails CI.
          python - "$tmpdir"/wheelhouse/sicario_spec-*.whl <<'EOF'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          mods = [n for n in names if n.startswith("presets/") and n.endswith(".py")]
          rules = [n for n in names if "assets" in n and n.endswith(".rule.json")]
          assert len(mods) >= 3, f"presets modules missing from wheel: {mods}"
          assert len(rules) >= 21, f"packaged rules missing from wheel: {len(rules)}"
          print(f"wheel content ok: {len(mods)} preset modules, {len(rules)} rules")
          EOF
          "$tmpdir/venv/bin/pip" install "$tmpdir"/wheelhouse/sicario_spec-*.whl
          "$tmpdir/venv/bin/sicario" --version
          "$tmpdir/venv/bin/sicario" init "$tmpdir/project" --profile appsec,cloud-iac,security-toolchain,compliance
          "$tmpdir/venv/bin/sicario" verify "$tmpdir/project"

  # FR-051: re-executes the paired commands of every `verified` output block
  # in docs/guides/*.md and docs/playbooks/*.md and diffs observed output
  # against what is quoted. This is a SEPARATE check with its own exit code
  # (SEC-C-007) — it never runs `sicario verify`'s verdict path and cannot
  # affect it; a docs regression here does not block on the `test` job above,
  # and the `test` job's gate is unaffected by anything in this job.
  guide-outputs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Verify guide outputs
        # PYTHONPATH=. so the checkout's own sicario_cli is what every guide's
        # `sicario ...` command executes — a release that bumps VERSION or
        # changes CLI output without updating the guides fails here with a
        # clear message (FR-052's enforcement hook), never silently.
        run: PYTHONPATH=. python3 scripts/verify_guide_outputs.py
